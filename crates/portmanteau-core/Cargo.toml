[package]
name = "portmanteau-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = "1"
roxmltree = "0.21"
zspell = "0.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

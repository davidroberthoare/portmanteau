[package]
name = "portmanteau-api"
version = "0.1.0"
edition = "2021"

[dependencies]
portmanteau-core = { path = "../portmanteau-core" }
portmanteau-export = { path = "../portmanteau-export" }
portmanteau-import = { path = "../portmanteau-import" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
zip = { version = "2.4", default-features = false, features = ["deflate"] }

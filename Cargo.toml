[workspace]
members = [
    "crates/msc-core",
    "crates/msc-export",
    "crates/msc-api",
    "crates/msc-mcp",
    "crates/msc-cli",
]
resolver = "2"

[package]
name = "myscript"
version = "0.1.0"
edition = "2021"
description = "Scriptorium — a native writing studio for novels, film, TV and theatre"
default-run = "myscript"

[[bin]]
name = "myscript"
path = "src/main.rs"

[dependencies]
eframe = "0.31.1"
egui = "0.31.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
msc-core = { path = "crates/msc-core" }
msc-export = { path = "crates/msc-export" }
msc-api = { path = "crates/msc-api" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

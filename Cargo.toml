[workspace]
members = [
    "crates/portmanteau-core",
    "crates/portmanteau-export",
    "crates/portmanteau-api",
    "crates/portmanteau-import",
    "crates/portmanteau-mcp",
    "crates/portmanteau-cli",
    "crates/portmanteau-update",
]
resolver = "2"

# The one place the version lives. Every crate uses `version.workspace = true`,
# and a release tag `vX.Y.Z` must match it (the release workflow checks).
[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/davidroberthoare/portmanteau"

[package]
name = "portmanteau"
version.workspace = true
edition.workspace = true
description = "Portmanteau — a native writing studio for novels, film, TV and theatre"
license.workspace = true
repository.workspace = true
build = "build.rs"
default-run = "portmanteau"

[[bin]]
name = "portmanteau"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", features = ["glow"] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
arboard = "3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
portmanteau-core = { path = "crates/portmanteau-core" }
portmanteau-export = { path = "crates/portmanteau-export" }
portmanteau-api = { path = "crates/portmanteau-api" }
portmanteau-update = { path = "crates/portmanteau-update" }
rfd = "0.17"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = "0.37"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

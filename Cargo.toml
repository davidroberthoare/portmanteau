[workspace]
members = [
    "crates/portmanteau-core",
    "crates/portmanteau-export",
    "crates/portmanteau-api",
    "crates/portmanteau-mcp",
    "crates/portmanteau-cli",
]
exclude = ["vendor/egui_spellcheck"]
resolver = "2"

[package]
name = "portmanteau"
version = "0.1.0"
edition = "2021"
description = "Portmanteau — a native writing studio for novels, film, TV and theatre"
default-run = "portmanteau"

[[bin]]
name = "portmanteau"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", features = ["glow"] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
# TRIAL: vendored from crates.io 0.36.3 with its egui dependency bumped to 0.37.
# Grammar is disabled; the crate still ships its own spellbook dictionary.
egui_spellcheck = { path = "vendor/egui_spellcheck", default-features = false }
arboard = "3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
portmanteau-core = { path = "crates/portmanteau-core" }
portmanteau-export = { path = "crates/portmanteau-export" }
portmanteau-api = { path = "crates/portmanteau-api" }

[dev-dependencies]
egui_kittest = "0.37"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
